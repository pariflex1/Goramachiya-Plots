<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Downloading PDF...</title>
</head>
<body>

<script>
(function () {
  const pdfUrl = "https://raw.githubusercontent.com/pariflex1/Goramachiya-Plots/c086159d348b0c7b45ede9a7b01dd4712e775871/Maa%20Peetanbra%20Goramachiya.pdf";

  fetch(pdfUrl)
    .then(response => response.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Maa_Peetanbra_Goramachiya.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    });
})();
</script>

</body>
</html>
